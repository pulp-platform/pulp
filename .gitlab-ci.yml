stages:
  - nonfree
  - PULP_CI

init:
  stage: nonfree
  script: make pulp_nonfree_init
  artifacts:
    paths:
      - nonfree/new_testing_setup/.gitlab-ci_new_rtl.yml
      - nonfree/new_testing_setup/.gitlab-ci_new_gvsoc.yml
      - nonfree/new_testing_setup/.gitlab-ci_new_fpga.yml

subpipe_rtl:
  stage: nonfree
  needs: [ init ]
  variables:
    PARENT_PIPELINE_SOURCE: $CI_PIPELINE_SOURCE
  trigger:
    include:
      - artifact: nonfree/new_testing_setup/.gitlab-ci_new_rtl.yml
        job: init
    strategy: depend

subpipe_gvsoc:
  stage: nonfree
  needs: [ init ]
  variables:
    PARENT_PIPELINE_SOURCE: $CI_PIPELINE_SOURCE
  trigger:
    include:
      - artifact: nonfree/new_testing_setup/.gitlab-ci_new_gvsoc.yml
        job: init
    strategy: depend

subpipe_fpga:
  stage: PULP_CI
  needs: [ init ]
  when: manual
  variables:
    PARENT_PIPELINE_SOURCE: $CI_PIPELINE_SOURCE
  trigger:
    include:
      - artifact: nonfree/new_testing_setup/.gitlab-ci_new_fpga.yml
        job: init
    strategy: depend
